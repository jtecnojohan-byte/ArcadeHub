name: Deploy ArcadeHub to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        env:
          VITE_SUPABASE_URL: https://twzqghrphxmafnpesywz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5Lo15a2WncSZ0kn0QaFfWg_nMuJQAwg
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  android:
    name: Build ArcadeHub Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        env:
          VITE_SUPABASE_URL: https://twzqghrphxmafnpesywz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_5Lo15a2WncSZ0kn0QaFfWg_nMuJQAwg
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Generate ArcadeHub pixel icon
        run: |
          node --input-type=module <<'NODE'
          import sharp from 'sharp';
          import { mkdir } from 'node:fs/promises';
          const sizes = { 'mipmap-mdpi':48, 'mipmap-hdpi':72, 'mipmap-xhdpi':96, 'mipmap-xxhdpi':144, 'mipmap-xxxhdpi':192 };
          for (const [folder,size] of Object.entries(sizes)) {
            const dir = `android/app/src/main/res/${folder}`;
            await mkdir(dir,{recursive:true});
            await sharp('assets/arcadehub-icon.svg').resize(size,size).png().toFile(`${dir}/ic_launcher.png`);
            await sharp('assets/arcadehub-icon.svg').resize(size,size).png().toFile(`${dir}/ic_launcher_round.png`);
          }
          NODE
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ArcadeHub-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
